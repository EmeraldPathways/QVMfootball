<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} · QVM Football Workbench</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <header class="border-b border-slate-800 bg-slate-950/95">
      <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-5 py-4">
        <a href="/" class="font-semibold tracking-wide">QVM Football Workbench</a>
        <span class="rounded-full border border-emerald-500/30 bg-emerald-500/10 px-3 py-1 text-xs text-emerald-300">PAPER MODE</span>
      </div>
    </header>
    <nav class="border-b border-slate-800 bg-slate-900/50">
      <div class="mx-auto flex max-w-7xl gap-5 overflow-x-auto px-5 py-3 text-sm text-slate-400">
        <a class="whitespace-nowrap hover:text-white" href="/">Overview</a>
        <a class="whitespace-nowrap hover:text-white" href="/edge-finder">Edge Finder</a>
        <a class="whitespace-nowrap hover:text-white" href="/performance">Performance</a>
        <a class="whitespace-nowrap hover:text-white" href="/agents">AI Ops</a>
      </div>
    </nav>
    <main class="mx-auto max-w-7xl px-5 py-8">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
